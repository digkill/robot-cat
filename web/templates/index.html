<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Робот — панель управления</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🤖 Робот — панель управления</h1>
  </header>

  <main>
    <section class="card">
      <h2>📡 Камера робота</h2>
      <div class="camera-panel">
        <img id="cameraStream" class="camera-stream" src="/camera/stream" alt="Live stream камеры робота" />
        <div class="camera-controls">
          <button id="cameraRecordBtn">Начать запись</button>
          <button id="cameraRefreshBtn">Обновить статус</button>
          <span id="cameraStatus">Подключение...</span>
        </div>
        <div id="cameraResult" class="camera-result"></div>
      </div>
    </section>

    <section class="card">
      <h2>🎭 Лицо робота</h2>
      <div class="face-panel">
        <div class="face-grid">
          <label>Эмоция
            <select id="faceEmotion"></select>
          </label>
          <label>Тема
            <select id="faceTheme"></select>
          </label>
          <label>Анимация
            <select id="faceAnimation"></select>
          </label>
          <label>Фон
            <select id="faceBackground"></select>
          </label>
        </div>
        <div class="face-actions">
          <input id="backgroundUpload" type="file" accept="image/*,video/*" />
          <button id="faceApplyBtn">Применить</button>
          <button id="faceRefreshBtn">Обновить</button>
          <span id="faceStatus"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>🔊 Звук робота</h2>
      <div class="audio-panel">
        <label class="audio-label" for="volumeSlider">Громкость</label>
        <input id="volumeSlider" type="range" min="0" max="100" step="1" value="100" />
        <div class="audio-controls">
          <span id="volumeValue">100%</span>
          <button id="muteToggleBtn">Mute</button>
          <span id="audioStatus"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>📋 События <span id="stateBadge"></span></h2>
      <div id="events" class="events-list"></div>
      <button onclick="loadEvents()">Обновить</button>
    </section>
    <section class="card">
      <h2>📜 Лог (watchlog)</h2>
      <pre id="watchlog" class="watchlog"></pre>
      <button onclick="loadLog()">Обновить</button>
    </section>

    <section class="card">
      <h2>📹 Записи с камеры</h2>
      <div id="recordings" class="recordings-grid"></div>
      <button onclick="loadRecordings()">Обновить</button>
    </section>

    <section class="card">
      <h2>📷 Снимки</h2>
      <div id="snapshots" class="snapshots-grid"></div>
      <button onclick="loadSnapshots()">Обновить</button>
    </section>

    <section class="card">
      <h2>🎤 Голосовой ассистент</h2>
      <div class="assistant">
        <input type="text" id="assistantInput" placeholder="Напишите сообщение..." />
        <button onclick="sendToAssistant()">Отправить</button>
      </div>
      <div class="assistant-voice">
        <button id="recordBtn">🎙️ Записать голос</button>
        <span id="recordStatus"></span>
      </div>
      <div id="assistantReply" class="reply"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
